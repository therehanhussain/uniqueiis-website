  <circle cx="250" cy="250" r="222" fill="#5A3A05"/>
  <circle cx="250" cy="250" r="218" fill="url(#goldInnerRim)"/>
  <circle cx="250" cy="250" r="212" fill="#2E1D02"/>
  <!-- Inner Deep Navy Core -->
  <circle cx="250" cy="250" r="210" fill="url(#navyBg)"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
