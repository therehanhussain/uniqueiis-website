  <path d="M 432,390 L 460,365 L 425,348 L 422,375 Z" fill="#754E0F"/>
  <path d="M 65,372 C 120,405 380,405 435,372 L 442,398 C 380,432 120,432 58,398 Z" fill="url(#ribbonGold)" stroke="#6A460A" stroke-width="1.5" filter="url(#shadowFilter)"/>
