<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA771C"/>
      <stop offset="75%" stop-color="#FDF0A6"/>
      <stop offset="100%" stop-color="#8B5E14"/>
    </linearGradient>

    <linearGradient id="goldInnerRim" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="30%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#A6731B"/>
      <stop offset="100%" stop-color="#FFF2A3"/>
    </linearGradient>

    <linearGradient id="goldElement" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="50%" stop-color="#DFB73D"/>
      <stop offset="100%" stop-color="#9E6813"/>
    </linearGradient>

    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4B8"/>
      <stop offset="20%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#DDA92B"/>
      <stop offset="85%" stop-color="#F3DC7C"/>
      <stop offset="100%" stop-color="#946214"/>
    </linearGradient>

    <radialGradient id="navyBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#12345E"/>
      <stop offset="65%" stop-color="#091C36"/>
      <stop offset="100%" stop-color="#040D1C"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Medallion Outer Base & Rim -->
